services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: pix2pix
    container_name: pix2pix-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

