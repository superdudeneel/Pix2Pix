[project]
name = "pix2pix"
version = "0.1.0"
description = "Pix2Pix is an image-to-image translation deep learning framework"
readme = "README.md"
authors = [
    { name = "Neel", email = "neelsane@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
pix2pix = "pix2pix.train:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
